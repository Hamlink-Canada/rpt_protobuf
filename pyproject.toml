[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "rpt-protobuf"
version = "0.2.0"
description = "Shared repeater protobuf messages"
requires-python = ">=3.13"
readme = "README.md"
license = "AGPL-3.0-or-later"
dependencies = ["protobuf>=7.35.1,<8"]

[project.optional-dependencies]
grpc = ["grpcio>=1.85.1,<2"]

[dependency-groups]
dev = ["pytest>=9.2,<10", "ruff>=0.17.4,<0.18", "build>=1.6,<2", "grpcio-tools==1.85.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["*_pb2.py", "*_pb2.pyi", "*_pb2_grpc.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.package-data]
rpt_protobuf = ["*.pyi"]
